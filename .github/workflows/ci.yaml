# CI for shack-app: test, build, push to GHCR, then hand over to Argo CD via the GitOps repo.
name: build-and-release

on:
  workflow_dispatch:

permissions:
  contents: read        # read this repo
  packages: write       # push the image to GHCR with GITHUB_TOKEN

concurrency:
  group: release-shack-app
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/shack-app
  GITOPS_REPO: ${{ github.repository_owner }}/shack-gitops

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the app code
        uses: actions/checkout@v4

      - name: Work out the image tag from the commit
        run: echo "TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Smoke test the app
        run: |
          docker build -t shack-app:test .
          docker run -d --name smoke -p 3000:3000 shack-app:test
          for i in $(seq 1 10); do
            curl -fsS http://localhost:3000/healthz && break
            sleep 1
          done
          curl -fsS http://localhost:3000/healthz
          docker rm -f smoke

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}

      - name: Check out the GitOps repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Point the GitOps repo at the new image
        working-directory: gitops/apps/shack-app
        run: |
          yq -i '.images[0].newTag = strenv(TAG)' kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kustomization.yaml
          git commit -m "deploy shack-app ${TAG}" || { echo "No change to commit"; exit 0; }
          git pull --rebase
          git push
